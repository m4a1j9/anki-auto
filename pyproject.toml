[project]
name = "anki-auto"
version = "0.1.0"
description = "Generate Anki cards for tech-interview English from a curated phrase list."
requires-python = ">=3.11"

[tool.poe.tasks]
setup           = { cmd = "pip install -r requirements.txt",                  help = "Install Python dependencies." }
build           = { cmd = "python -m src.main",                               help = "Build any deck. Usage: poe build -- -p <deck/path> [-n <examples>]." }
build-interview = { cmd = "python -m src.main -p English/phrases/interview",  help = "Build the tech-interview deck." }
build-common    = { cmd = "python -m src.main -p English/common",             help = "Build the everyday-vocab deck." }

[tool.poe.tasks.clean]
cmd = "python -c \"import shutil; [shutil.rmtree(d, ignore_errors=True) for d in ('output', 'media')]\""
help = "Remove generated deck and audio cache."
